server:
  port: 8080

app:
  kafka:
    transactions-topic: ${MIDAS_TRANSACTIONS_TOPIC:midas.transactions}

general:
  kafka-topic: ${app.kafka.transactions-topic}

spring:
  datasource:
    url: jdbc:h2:mem:dcbapp-test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
    ddl-auto: create-drop
    open-in-view: false
  h2:
    console:
      enabled: true

  kafka:
    bootstrap-servers: ${spring.embedded.kafka.brokers:localhost:9092}
    consumer:
      group-id: midas-core
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.value.default.type: com.jpmc.midascore.foundation.Transaction
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

logging:
  level:
    org.springframework: WARN
    org.hibernate.SQL: WARN
