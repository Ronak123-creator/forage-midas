spring:
  # Use the same in-memory DB for tests (fresh schema per test run)
  datasource:
    url: jdbc:h2:mem:dcbapp-test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: false

  kafka:
    # For unit tests that only start the context, this is fine.
    # If you use Testcontainers, you can override via env var or @DynamicPropertySource.
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      group-id: midas-core-test

# Provide the placeholder the KafkaProducer expects during tests
general:
  kafka-topic: test-topic

logging:
  level:
    org.springframework: WARN
    org.hibernate.SQL: WARN
